<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — AARON</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<style>
main{padding:130px clamp(18px,4vw,50px) 80px;max-width:760px;margin:0 auto}
h1{font-size:clamp(38px,6.6vw,84px);font-weight:800;letter-spacing:-.02em;line-height:1}
.lead{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);line-height:2.1}

form{margin-top:clamp(32px,5vh,54px);display:grid;gap:clamp(22px,3.6vh,34px)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3.5vw,40px)}
@media(max-width:620px){.row2{grid-template-columns:1fr}}

.field{position:relative}
.field label{
  display:block;font-size:10px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;
  color:var(--soft);margin-bottom:10px;transition:color .3s;
}
.field:focus-within label{color:var(--ink)}
.field input,.field select,.field textarea{
  width:100%;border:0;outline:0;background:#fff;
  font:inherit;font-size:clamp(15px,1.8vw,18px);color:var(--ink);
  padding:14px 16px;border-radius:14px;resize:vertical;
  box-shadow:inset 0 0 0 1px var(--faint);
  transition:box-shadow .3s,transform .3s var(--boing);
}
.field textarea{min-height:130px;line-height:1.6}
.field:focus-within input,.field:focus-within select,.field:focus-within textarea{
  box-shadow:inset 0 0 0 1.2px var(--ink);
  transform:translateY(-2px);
}
/* squiggle appears under the focused field */
.field svg.fline{position:absolute;left:8%;bottom:-8px;width:84%;height:8px;overflow:visible;pointer-events:none}
.field svg.fline path{
  fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  stroke-dasharray:1200;stroke-dashoffset:1200;
  transition:stroke-dashoffset .8s var(--ease);
}
.field:focus-within svg.fline path{stroke-dashoffset:0}

.send{
  justify-self:center;display:inline-flex;align-items:center;gap:14px;
  background:var(--ink);color:var(--paper);border:0;cursor:pointer;font:inherit;
  font-size:14px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
  padding:18px 46px;border-radius:999px;
  transition:transform .4s var(--boing),background .3s;
}
.send:hover{transform:translateY(-4px) rotate(-1.5deg)}
.send .ar{transition:transform .35s var(--boing)}
.send:hover .ar{transform:translateX(5px)}
.status{text-align:center;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--soft);min-height:1.4em}

.also{
  margin-top:clamp(44px,7vh,70px);border-top:1px dashed #ddd9cd;padding-top:26px;
  display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;
  font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--soft);line-height:2.2;
}
.also a{transition:color .3s,transform .3s var(--boing);display:inline-block}
.also a:hover{color:var(--ink);transform:translateY(-2px)}
</style>
</head>
<body data-trail="off">

<header>
  <a class="logo" href="index.html" data-cut>AARON</a>
  <nav>
    <a href="animals.html" data-cut>Animals<svg class="pill" viewBox="0 0 100 34" preserveAspectRatio="none"><path d="M17 3 C40 1 70 4 84 3 C96 4 98 12 96 18 C97 27 90 31 80 31 C55 33 30 30 16 31 C6 31 2 25 3 17 C2 9 8 3 17 3"/></svg></a>
    <a href="game.html" data-cut>Game<svg class="pill" viewBox="0 0 100 34" preserveAspectRatio="none"><path d="M17 3 C40 1 70 4 84 3 C96 4 98 12 96 18 C97 27 90 31 80 31 C55 33 30 30 16 31 C6 31 2 25 3 17 C2 9 8 3 17 3"/></svg></a>
    <a href="profile.html" data-cut>Profile<svg class="pill" viewBox="0 0 100 34" preserveAspectRatio="none"><path d="M17 3 C40 1 70 4 84 3 C96 4 98 12 96 18 C97 27 90 31 80 31 C55 33 30 30 16 31 C6 31 2 25 3 17 C2 9 8 3 17 3"/></svg></a>
    <a href="contact.html" class="here">Contact</a>
  </nav>
</header>

<main>
  <h1 class="pop">SAY HELLO</h1>

  <form id="f" class="pop d2">
    <div class="row2">
      <div class="field">
        <label for="nm">Your name</label>
        <input id="nm" type="text" required autocomplete="name">
        <svg class="fline" viewBox="0 0 400 8" preserveAspectRatio="none"><path d="M1 4 C90 1 210 7 300 3 S380 5 399 4"/></svg>
      </div>
      <div class="field">
        <label for="em">Your e-mail</label>
        <input id="em" type="email" required autocomplete="email">
        <svg class="fline" viewBox="0 0 400 8" preserveAspectRatio="none"><path d="M1 5 C110 8 240 2 340 6 S390 3 399 5"/></svg>
      </div>
    </div>

    <div class="field">
      <label for="sb">Subject</label>
      <select id="sb">
        <option>General</option>
        <option>Prints &amp; frames</option>
        <option>Exhibition</option>
        <option>Commission</option>
      </select>
      <svg class="fline" viewBox="0 0 400 8" preserveAspectRatio="none"><path d="M1 4 C130 7 260 1 399 5"/></svg>
    </div>

    <div class="field">
      <label for="ms">Message</label>
      <textarea id="ms" required placeholder="write a line…"></textarea>
      <svg class="fline" viewBox="0 0 400 8" preserveAspectRatio="none"><path d="M1 5 C80 2 180 8 280 4 S370 6 399 4"/></svg>
    </div>

    <button class="send" type="submit">Send <span class="ar">→</span></button>
    <p class="status" id="status"></p>
  </form>

</main>

<footer>
  <span>© 2004–2026 AARON LEE</span>
  <a href="index.html" data-cut>← intro</a>
</footer>

<script src="shared.js"></script>
<script>
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  const g=id=>document.getElementById(id).value.trim();
  const body=encodeURIComponent(`${g('ms')}\n\n— ${g('nm')}\n${g('em')}`);
  const subject=encodeURIComponent(`[${g('sb')}] from ${g('nm')}`);
  location.href=`mailto:aaronlee103@gmail.com?subject=${subject}&body=${body}`;
  document.getElementById('status').textContent='opening your mail app… (to aaronlee103@gmail.com)';
});
</script>
</body>
</html>
